<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenToonz Slate PNG Generator — VAIZU </title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <div class="layout">
    <div class="card">
      <h1>Slate PNG Generator</h1>

      <div class="row">
        <label for="bgFile">Template Referensi (Opsional untuk Preview)</label>
        <input id="bgFile" type="file" accept="image/*" />
      </div>

      <label class="check">
        <input id="showGuide" type="checkbox" checked />
        Tampilkan panduan posisi template di preview (tidak ikut ter-export)
      </label>

      <div class="section-box">
        <div class="section-title">Pengaturan TITLE.</div>
        <div class="row">
          <label for="titleVal">Teks TITLE.</label>
          <input id="titleVal" type="text" value="Ghost Rule Fan Animation" />
        </div>
        <div class="row grid-2">
          <div>
            <label for="titleFontSize">Ukuran Font TITLE (%)</label>
            <input id="titleFontSize" type="number" step="0.1" min="0.8" max="6.0" value="2.8" />
          </div>
          <div>
            <label for="titleSpacing">Kerapatan TITLE (px)</label>
            <input id="titleSpacing" type="number" step="1" min="-30" max="60" value="-5" />
          </div>
        </div>
        <div class="row grid-2">
          <div>
            <label for="titleOffsetX">Geser X TITLE (%)</label>
            <input id="titleOffsetX" type="number" step="0.1" value="0" />
          </div>
          <div>
            <label for="titleOffsetY">Geser Y TITLE (%)</label>
            <input id="titleOffsetY" type="number" step="0.1" value="0" />
          </div>
        </div>
      </div>

      <div class="row grid-2">
        <div>
          <label for="noVal">NO.</label>
          <input id="noVal" type="text" value="" placeholder="opsional" />
        </div>
        <div>
          <label for="sceneVal">S. (Scene)</label>
          <input id="sceneVal" type="text" value="01" />
        </div>
      </div>

      <div class="row grid-2">
        <div>
          <label for="cutVal">C. (Cut)</label>
          <input id="cutVal" type="text" value="02" />
        </div>
        <div>
          <label for="framesVal">Total Frames</label>
          <input id="framesVal" type="number" min="0" value="186" />
        </div>
      </div>

      <div class="row grid-3">
        <div>
          <label for="fpsVal">FPS</label>
          <input id="fpsVal" type="number" min="1" max="120" value="24" />
        </div>
        <div>
          <label for="fontFamily">Gaya Font</label>
          <select id="fontFamily">
            <option value='"Segoe Print", "Comic Sans MS", cursive'>Handwritten Rapi</option>
            <option value='"Trebuchet MS", "Segoe UI", sans-serif'>Clean Sans</option>
            <option value='"Consolas", "Courier New", monospace' selected>Technical Mono</option>
          </select>
        </div>
        <div>
          <label for="fontWeight">Ketebalan Font</label>
          <select id="fontWeight">
            <option value="400">400 (Normal)</option>
            <option value="500" selected>500 (Medium)</option>
            <option value="600">600 (SemiBold)</option>
            <option value="700">700 (Bold)</option>
            <option value="800">800 (ExtraBold)</option>
          </select>
        </div>
      </div>

      <div class="row grid-3">
        <div>
          <label for="fontSize">Ukuran Lain (%)</label>
          <input id="fontSize" type="number" step="0.1" min="0.8" max="6.0" value="3.5" />
        </div>
        <div>
          <label for="inkColor">Warna Teks</label>
          <input id="inkColor" type="color" value="#111111" />
        </div>
        <div>
          <label for="offsetX">Geser X (%)</label>
          <input id="offsetX" type="number" step="0.1" value="0" />
        </div>
      </div>

      <div class="row grid-2">
        <div>
          <label for="offsetY">Geser Y (%)</label>
          <input id="offsetY" type="number" step="0.1" value="1" />
        </div>
        <div>
          <label>&nbsp;</label>
          <button type="button" id="resetBtn" style="width: 100%;">Reset Posisi &amp; TITLE</button>
        </div>
      </div>

      <div class="actions">
        <button class="primary" id="downloadBtn" style="width: 100%;">Download PNG Transparan</button>
      </div>
    </div>

    <div class="card">
      <div class="preview-stage">
        <canvas id="previewCanvas" width="2360" height="1666"></canvas>
      </div>
      <div class="status">
        <span id="infoReadout">TIME ( 7 + 18 ) | Ukuran Export: 2360 x 1666 px</span>
        <span>Hasil unduhan: Hanya teks + latar 100% transparan</span>
      </div>
    </div>
  </div>
</body>
</html>
